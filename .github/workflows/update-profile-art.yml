name: Update profile art

on:
  schedule:
    - cron: "17 20 * * *"   # daily, ~06:17 Sydney time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only: no pip install needed
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/bump_readme_versions.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg README.md
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph [skip ci]"
          git push
